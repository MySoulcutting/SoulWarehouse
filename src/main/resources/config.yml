# SoulWarehouse 主配置文件
# 修改后可使用 /warehouse reload 重载，或重启服务器生效。
# 菜单标题、按钮、布局、UI 大小请到 ui/*.yml 中配置。

database:
  # 数据库类型：mysql / mariadb / postgresql / sqlite
  type: sqlite
  # 远程数据库地址（mysql / mariadb / postgresql 使用）
  host: localhost
  port: 3306
  user: root
  password: "123456"
  database: minecraft
  # SQLite 文件名，仅在 type=sqlite 时使用
  file: warehouse.db
  # 数据表前缀，仅允许字母、数字和下划线
  table-prefix: sw_
  # 是否启用 SSL
  use-ssl: false
  # 可选：手动指定 SSL 模式
  # ssl-mode: DISABLED

warehouse:
  # 玩家默认拥有的页数，不能大于 max-pages
  default-pages: 3

  # 仓库最大页数
  max-pages: 10

  # 每页最多可用的逻辑仓库槽位数，最终容量还会受 ui/page.yml 的 storage-slots 数量影响
  page-size: 45

  # 是否允许潜影盒放入仓库
  allow-shulker-box: true

  # 禁止放入仓库的物品，支持材质名（如 BEDROCK）、物品显示名称和 Lore 行
  # 匹配时忽略大小写和颜色代码，Lore 任意一行命中即拦截
  blacklist:
    - BEDROCK
    - "&c禁止放入"
    - ""
  # 仓库分类 (未设置分类的页为默认分类，自动拾取入仓不做限制)
  # 自动拾取入仓时，只有物品 Lore 匹配该页分类时才会存入
  # 玩家手动放入时不做限制，任何物品都可以放入任何页
  categories:
    # 分类名 → Lore 匹配规则列表，物品 Lore 中包含任意一行即视为匹配
    材料:
      - "&f类型: &7材料"
      - "&f类型: &7珍贵材料"

save:
  # 是否启用自动保存
  auto-save: true

  # 自动保存间隔（秒）
  auto-save-interval: 300

# 调试模式，开启后会在控制台输出详细的操作日志（存入、取出、保存耗时等）
debug: false
