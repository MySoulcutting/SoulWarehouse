# SoulWarehouse 主配置文件
# 修改后可使用 /warehouse reload 重载，或重启服务器生效。
# 菜单标题、按钮、布局、UI 大小请到 ui/*.yml 中配置。

database:
  # 数据库类型：mysql / mariadb / postgresql / sqlite
  type: mysql
  # 远程数据库地址（mysql / mariadb / postgresql 使用）
  host: localhost
  port: 3306
  user: root
  password: "123456"
  database: minecraft
  # SQLite 文件名，仅在 type=sqlite 时使用
  file: warehouse.db
  # 数据表前缀，仅允许字母、数字和下划线
  table-prefix: sw_
  # 是否启用 SSL
  use-ssl: false
  # 可选：手动指定 SSL 模式
  # ssl-mode: DISABLED

warehouse:
  # 玩家默认拥有的页数，不能大于 max-pages
  default-pages: 3

  # 仓库最大页数，当前插件支持 1-10 页
  max-pages: 10

  # 每页最多可用的逻辑仓库槽位数，最终容量还会受 ui/page.yml 的 storage-slots 数量影响
  page-size: 45

  # 是否允许潜影盒放入仓库
  allow-shulker-box: true

  # 禁止放入仓库的物品材质
  blacklist:
    - BEDROCK

save:
  # 是否启用自动保存
  auto-save: true

  # 自动保存间隔（秒）
  auto-save-interval: 300

  # 玩家关闭仓库界面时是否立即保存
  save-on-close: true

  # 玩家退出服务器时是否立即保存
  save-on-quit: true

pickup:
  # 玩家拾取地面掉落物时，是否优先自动存入仓库
  auto-store-drops: true
