# 玩家自己的仓库页
# 可用占位符：{player} {page} {max_pages} {page_size} {remark}
#
# 布局字符说明：
#   S = 存储槽位（前 N 个为可用，N = min(config.yml 的 warehouse.page-size, S 总数)）
#   B = 背景填充  D = 不可用槽位（由代码根据 page-size 自动处理，无需在布局中出现）
#   < = 上一页  > = 下一页  = = 当前页信息  K = 返回主页  X = 关闭菜单

title: "&8我的仓库 - 第 {page} 页"
layout:
  - "SSSSSSSSS"
  - "SSSSSSSSS"
  - "SSSSSSSSS"
  - "SSSSSSSSS"
  - "SSSSSSSSS"
  - "< B B = K X B B >"

items:
  background:
    char: "B"
    material: GRAY_STAINED_GLASS_PANE
    name: " "

  disabled-storage:
    material: LIGHT_GRAY_STAINED_GLASS_PANE
    name: "&8不可用槽位"
    lore:
      - "&7当前配置未开放这个槽位"

  previous:
    char: "<"
    material: ARROW
    name: "&e上一页"
    lore:
      - "&7前往第 &f{page} &7页"

  current:
    char: "="
    material: CHEST
    name: "&b当前页面：第 {page} 页"
    lore:
      - "&7你当前正在编辑第 &f{page} &7页"
      - "&7总可用页数：&f{max_pages}"
      - "&7备注：&f{remark}"

  back:
    char: "K"
    material: BOOK
    name: "&e返回主页"
    lore:
      - "&7返回仓库页选择界面"

  close:
    char: "X"
    material: BARRIER
    name: "&c关闭菜单"
    lore:
      - "&7关闭当前仓库界面"

  next:
    char: ">"
    material: ARROW
    name: "&e下一页"
    lore:
      - "&7前往第 &f{page} &7页"
