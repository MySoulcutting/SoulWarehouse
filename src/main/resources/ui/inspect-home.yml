# 管理员查看别人仓库主页
# 可用占位符：{player} {target} {page} {used} {page_size} {max_pages} {remark} {category}
# 当 {remark} 或 {category} 为空时，包含该占位符的整行会自动隐藏
#
# 布局字符说明：
#   F = 填充物  P = 仓库页槽位
#   I = 仓库信息  O = 只读模式  C = 关闭菜单

title: "&8查看仓库 - {player}"
layout:
  - "FFFFFFFFF"
  - "FPPPPPFFF"
  - "FPPPPPFFF"
  - "FFFFFFFFF"
  - "FFFFFFFFF"
  - "I F F F O F F F C"

items:
  filler:
    char: "F"
    material: STAINED_GLASS_PANE
    name: " "
    durability: 7

  page:
    char: "P"
    material: ENDER_CHEST
    name: "&6仓库第 {page} 页"
    lore:
      - "&7状态：&b只读查看"
      - "&7已使用：&f{used}&7/&f{page_size}"
      - "&7分类：&f{category}"
      - "&7备注：&f{remark}"
      - "&e点击查看这一页内容"

  locked-page:
    material: BARRIER
    name: "&6仓库第 {page} 页"
    lore:
      - "&7状态：&c未解锁"
      - "&7这个页面当前不可查看"

  profile:
    char: "I"
    material: PAPER
    name: "&b仓库信息"
    lore:
      - "&7目标玩家：&f{player}"
      - "&7可查看页数：&f{max_pages}"
      - "&7每页槽位：&f{page_size}"

  readonly:
    char: "O"
    material: BOOK
    name: "&b只读模式"
    lore:
      - "&7当前正在查看：&f{player}"
      - "&c管理员查看模式不可修改物品"

  close:
    char: "C"
    material: BARRIER
    name: "&c关闭菜单"
    lore:
      - "&7关闭当前仓库界面"
