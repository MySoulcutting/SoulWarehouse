# 管理员查看别人仓库页
# 可用占位符：{player} {target} {page} {max_pages} {page_size} {remark}
#
# 布局字符说明：
#   S = 存储槽位  B = 背景填充
#   < = 上一页  > = 下一页  O = 只读模式  K = 返回主页  X = 关闭菜单

title: "&8查看仓库 - {player} - 第 {page} 页"
layout:
  - "SSSSSSSSS"
  - "SSSSSSSSS"
  - "SSSSSSSSS"
  - "SSSSSSSSS"
  - "SSSSSSSSS"
  - "< B B O K X B B >"

items:
  background:
    char: "B"
    material: STAINED_GLASS_PANE
    name: " "
    durability: 7

  disabled-storage:
    material: STAINED_GLASS_PANE
    name: "&8不可用槽位"
    durability: 8
    lore:
      - "&7当前布局未显示这个槽位"

  previous:
    char: "<"
    material: ARROW
    name: "&e上一页"
    lore:
      - "&7前往第 &f{page} &7页"

  readonly:
    char: "O"
    material: BOOK
    name: "&b只读模式"
    lore:
      - "&7当前正在查看：&f{player}"
      - "&7当前页码：&f{page}"
      - "&7总可查看页数：&f{max_pages}"
      - "&7备注：&f{remark}"
      - "&c管理员查看模式不可修改物品"

  back:
    char: "K"
    material: CHEST
    name: "&e返回主页"
    lore:
      - "&7返回仓库页选择界面"

  close:
    char: "X"
    material: BARRIER
    name: "&c关闭菜单"
    lore:
      - "&7关闭当前仓库界面"

  next:
    char: ">"
    material: ARROW
    name: "&e下一页"
    lore:
      - "&7前往第 &f{page} &7页"
